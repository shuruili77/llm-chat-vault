<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131722"/>
      <stop offset="50%" stop-color="#0c0f17"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    
    <linearGradient id="rimGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="bubble1A" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="bubble2A" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="sparkGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="ambientA" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background Windows 11 Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGradA)" stroke="url(#rimGradA)" stroke-width="3.5"/>
  
  <!-- Subtle ambient glow in center -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.12" filter="url(#ambientA)"/>

  <!-- Left/Top Speech Bubble (User Prompt & Query stream) -->
  <path d="M 175,130
           C 230,130 335,130 335,130
           C 365,130 380,150 380,180
           C 380,225 350,250 300,250
           L 205,250
           L 150,290
           L 155,250
           C 135,250 120,235 120,205
           C 120,155 145,130 175,130 Z"
        fill="none"
        stroke="url(#bubble1A)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowA)"/>

  <!-- Right/Bottom Speech Bubble (AI Response stream) -->
  <path d="M 337,382
           C 282,382 177,382 177,382
           C 147,382 132,362 132,332
           C 132,287 162,262 212,262
           L 307,262
           L 362,222
           L 357,262
           C 377,262 392,277 392,307
           C 392,357 367,382 337,382 Z"
        fill="none"
        stroke="url(#bubble2A)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowA)"/>

  <!-- Synapse Node Connectors -->
  <line x1="205" y1="190" x2="256" y2="256" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <line x1="307" y1="322" x2="256" y2="256" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <line x1="307" y1="190" x2="256" y2="256" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <line x1="205" y1="322" x2="256" y2="256" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Outer Neural Nodes -->
  <circle cx="205" cy="190" r="11" fill="#00f2fe" stroke="#ffffff" stroke-width="3.5" filter="url(#glowA)"/>
  <circle cx="307" cy="190" r="11" fill="#38bdf8" stroke="#ffffff" stroke-width="3.5" filter="url(#glowA)"/>
  <circle cx="205" cy="322" r="11" fill="#a855f7" stroke="#ffffff" stroke-width="3.5" filter="url(#glowA)"/>
  <circle cx="307" cy="322" r="11" fill="#d946ef" stroke="#ffffff" stroke-width="3.5" filter="url(#glowA)"/>

  <!-- Center Glowing AI Core Spark -->
  <circle cx="256" cy="256" r="22" fill="url(#sparkGradA)" filter="url(#glowA)"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
  <!-- 4-point Diamond Spark -->
  <path d="M 256,224 Q 256,256 288,256 Q 256,256 256,288 Q 256,256 224,256 Q 256,256 256,224 Z" fill="#ffffff"/>
</svg>