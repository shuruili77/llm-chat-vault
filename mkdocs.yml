site_name: LLM Chat Vault Documentation
site_description: LLM Chat Vault - Local Archive & Viewer for ChatGPT and Claude Exports
site_url: https://shuruili77.github.io/llm-chat-vault/
repo_name: shuruili77/llm-chat-vault
repo_url: https://github.com/shuruili77/llm-chat-vault
edit_uri: edit/main/docs/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shuruili77/llm-chat-vault

theme:
  name: material
  font:
    text: Open Sans
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
    - Supported Formats: formats.md
  - Developer Guide:
    - Architecture: architecture.md
    - Development: development.md
  - Specifications:
    - Overview: spec/README.md
    - Conversation Parsing: spec/conversation-parsing.md
    - File Import: spec/file-import.md
    - Storage: spec/storage.md
    - Sidebar UI: spec/sidebar-ui.md
    - Chat View: spec/chat-view.md
    - Export: spec/export.md
    - State Management: spec/state-management.md
    - Markdown Rendering: spec/markdown-rendering.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
plugins:
  - search
  - social
